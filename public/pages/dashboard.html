<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar d-flex justify-content-between">
    <h4>⚡ Sports Player Management System</h4>
    <div>
        <button class="btn btn-light me-2" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light me-2" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light me-2" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-4">Dashboard</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h5>Total Players</h5>
                <h2 id="totalPlayers">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h5>Active Teams</h5>
                <h2 id="totalTeams">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h5>Sports Categories</h5>
                <h2 id="totalSports">0</h2>
            </div>
        </div>

    </div>

</div>

<script src="../js/main.js"></script>
</body>
</html>
