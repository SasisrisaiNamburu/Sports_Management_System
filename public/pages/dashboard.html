<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="#">Player Management System</a>

    <div class="ms-auto d-flex gap-2">
        <button class="btn btn-light btn-sm" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light btn-sm" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light btn-sm" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Dashboard</h2>

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card shadow p-4 text-center">
                <h5>Total Players</h5>
                <h2 id="dashboardCount">0</h2>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow p-4 text-center">
                <h5>Actions</h5>
                <button class="btn btn-primary mb-2" onclick="goToPlayers()">View Players</button>
                <button class="btn btn-success" onclick="goToAddPlayer()">Add Player</button>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
</div>

<script src="../js/main.js"></script>

</body>
</html>
