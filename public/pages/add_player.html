<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar d-flex justify-content-between">
    <h4>⚡ Sports Player Management System</h4>
    <div>
        <button class="btn btn-light me-2" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light me-2" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light me-2" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
</nav>

    <!-- MAIN CONTENT -->
    <div class="container mt-4">
    <h2>Add Player</h2>

    <form id="playerForm" class="card p-4">

        <input id="name" placeholder="Name" class="form-control mb-3">
        <input id="age" placeholder="Age" class="form-control mb-3">
        <input id="sport" placeholder="Sport" class="form-control mb-3">
        <input id="team" placeholder="Team" class="form-control mb-3">
        <input id="position" placeholder="Position" class="form-control mb-3">

        <button class="btn btn-success w-100">Add Player</button>

    </form>
</div>

<script src="../js/main.js"></script>
</body>
</html>
