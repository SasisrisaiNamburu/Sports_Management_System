<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="#">Player Management System</a>

    <div class="ms-auto d-flex gap-2">
        <button class="btn btn-light btn-sm" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light btn-sm" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light btn-sm" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="card p-4 shadow">

    <h2>Add Player</h2>

    <form id="playerForm">

        <input type="text" class="form-control mb-2" placeholder="Name" required>
        <input type="number" class="form-control mb-2" placeholder="Age" required>
	<input type="text" class="form-control mb-2" placeholder="Sport" required>
        <input type="text" class="form-control mb-2" placeholder="Team" required>
        <input type="text" class="form-control mb-2" placeholder="Position" required>

        <button class="btn btn-success mb-2">Add Player</button>
	<button class="btn btn-secondary mb-2" onclick="goToDashboard()">Go to Dashboard</button>

    </form>

</div>
<script src="../js/main.js"></script>

</body>
</html>
