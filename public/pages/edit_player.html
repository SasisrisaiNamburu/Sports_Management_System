<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="#">Player Management System</a>

    <div class="ms-auto d-flex gap-2">
        <button class="btn btn-light btn-sm" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light btn-sm" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light btn-sm" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Player</h2>

    <form id="editPlayerForm" class="card p-4 shadow">
        <input type="text" id="name" class="form-control mb-3" placeholder="Name" required>
	<input type="text" id="age" class="form-control mb-3" placeholder="Age" required>
        <input type="text" id="sport" class="form-control mb-3" placeholder="Sport" required>
	<input type="text" id="team" class="form-control mb-3" placeholder="Team" required>
        <input type="text" id="position" class="form-control mb-3" placeholder="Position" required>

        <button type="submit" class="btn btn-warning">Update Player</button>
    </form>
</div>

<script src="/js/main.js"></script>
</body>
</html>
