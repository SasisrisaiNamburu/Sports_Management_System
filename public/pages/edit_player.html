<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar d-flex justify-content-between">
    <h4>⚡ Sports Player Management System</h4>
    <div>
        <button class="btn btn-light me-2" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light me-2" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light me-2" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
</nav>

    <div class="main-content w-100 p-4">

        <h2>Edit Player</h2>

        <form id="editPlayerForm" class="card p-4">
            <input type="text" id="name" class="form-control mb-3" placeholder="Name" required>
            <input type="text" id="age" class="form-control mb-3" placeholder="Age" required>
            <input type="text" id="sport" class="form-control mb-3" placeholder="Sport" required>
            <input type="text" id="team" class="form-control mb-3" placeholder="Team" required>
            <input type="text" id="position" class="form-control mb-3" placeholder="Position" required>

            <button type="submit" class="btn btn-warning">Update Player</button>
        </form>

    </div>

<script src="../js/main.js"></script>
</body>
</html>
