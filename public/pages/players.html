<!DOCTYPE html>
<html lang="en">
<head>
    <title>Players</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar d-flex justify-content-between">
    <h4>⚡ Sports Player Management System</h4>
    <div>
        <button class="btn btn-light me-2" onclick="goToDashboard()">Dashboard</button>
        <button class="btn btn-light me-2" onclick="goToPlayers()">Players</button>
        <button class="btn btn-light me-2" onclick="goToAddPlayer()">Add Player</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-4">
    <h2>Players</h2>
    <input type="text" id="searchInput" placeholder="Search players, teams, sports..." class="form-control">

    <table class="table mt-3">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Sport</th>
                <th>Team</th>
                <th>Position</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="playerTable"></tbody>
    </table>
</div>

<script src="../js/main.js"></script>
</body>
</html>
